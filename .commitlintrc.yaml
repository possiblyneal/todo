# Rules for the commit-msg hook in .pre-commit-config.yaml.
#
# YAML rather than commitlint.config.mjs so this needs no package.json. A
# package.json at the root would make has_node() in scripts/libs/detect.sh
# true, and every check would start dispatching JavaScript adapters in a
# repository that contains no JavaScript. The check-yaml hook validates this
# file on every commit as a side effect of the format.
#
# Only the two rules the Conventional Commits specification states as MUST and
# config-conventional ships as warnings are overridden. Everything else --
# type-enum, subject-case, header-max-length, body-max-line-length -- is the
# stock preset, at error level already.
extends:
  - "@commitlint/config-conventional"

rules:
  # A body not separated from the subject by a blank line is not a body: git
  # reads the whole run of text as one subject line. This is a correctness
  # rule, not a style preference, which is why it is an error here.
  body-leading-blank: [2, always]

  # Same failure one paragraph down. Without the blank line, `BREAKING CHANGE:`
  # and `Refs: #12` are parsed as more body text, so a breaking change stops
  # being machine-readable at exactly the moment that matters.
  footer-leading-blank: [2, always]
