name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # CodeQL ships new queries continuously, so a weekly run finds problems in
    # code that has not changed since the last push.
    - cron: "41 7 * * 2"

# The floor every job starts from. security-events: write is not here: only
# `analyze` uploads results, and at the workflow level `detect` would inherit
# the ability to write findings into the Security tab in order to run a
# detection script. Each job widens from this to what it actually needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code scanning accepts uploaded results from a public repository, and from a
  # private one only with GitHub Advanced Security. Checking before analyzing
  # turns an hour of work that dies at its upload step into a failure arriving
  # in seconds that names what is wrong.
  #
  # This fails rather than skips, deliberately. A skipped job renders the
  # workflow green, so a repository with no scanning coverage would look on the
  # checks list exactly like one that scanned clean and found nothing -- the
  # same false green that suppressing the upload produces, reached by a
  # different route. No coverage is a real finding, and it stays red until
  # someone removes the workflow on purpose.
  #
  # It is its own job so the red check reads "Code scanning enabled" rather than
  # a language-detection failure that would misdescribe the problem.
  scanning:
    name: Code scanning enabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Visibility is read from the API rather than github.event.repository,
      # whose payload GitHub documents as "Not applicable" for schedule. Read
      # from the event, the weekly run would compare a null against "public"
      # and fail a public repository every Tuesday.
      - name: Check that code scanning can accept results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "${visibility}" = "public" ]; then
            echo "Repository is public. Code scanning accepts uploaded results."
            exit 0
          fi
          {
            echo "### Code scanning is not available"
            echo
            echo "Repository visibility is \`${visibility}\`. Code scanning accepts results"
            echo "from a public repository, or from a private one with GitHub Advanced"
            echo "Security. CodeQL would analyze the code and then fail at its upload step."
            echo
            echo "**This repository has no static analysis coverage.** Resolve it by one of:"
            echo
            echo "- making the repository public"
            echo "- enabling GitHub Advanced Security"
            echo "- deleting \`.github/workflows/codeql.yml\`, recording the omission under"
            echo "  \`features\` in \`.repo-template.json\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=No static analysis coverage::Code scanning cannot accept results from a repository with ${visibility} visibility, without GitHub Advanced Security. Make the repository public, enable Advanced Security, or delete this workflow on purpose."
          exit 1

  # CodeQL fails when told to analyze a language the repository does not
  # contain, so the language list comes from the manifests actually present
  # rather than from a fixed list this template cannot know.
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The matrix comes from scripts/detect rather than being built here,
      # so a language this repository checks is one CodeQL scans. This step
      # used to keep its own copy of detection, which is how a new stack ends up
      # linted and tested while nothing scans it for vulnerabilities.
      - name: Detect languages
        id: detect
        run: scripts/detect codeql-matrix >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: [scanning, detect]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The one job that uploads findings, so the one job that may write them.
    # actions: read lets CodeQL read workflow run metadata when scanning the
    # `actions` language in the matrix.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CodeQL's bundle ships its own Go, older than the one go.work asks for,
      # and the extractor runs go list against the workspace: without a
      # newer toolchain on PATH it fails with "go.work requires go >= 1.26.0"
      # and the Go analysis scans nothing while the job reports a failure.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Add .github/codeql/codeql-config.yml and uncomment the line below to
          # scope what gets analyzed or change which queries run. The two things
          # it is for: `paths` / `paths-ignore`, to keep vendored, generated, or
          # fixture code out of the results, and `queries` / `packs`, to run a
          # broader suite such as security-extended than the default one.
          #
          # It ships commented out because neither answer exists yet in a new
          # repository -- there is no code to have produced a false positive,
          # and the default suite is the right starting point. Note that the
          # config file is read only through this key: adding the file without
          # uncommenting the line leaves configuration that nothing applies and
          # nothing reports.
          # config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
