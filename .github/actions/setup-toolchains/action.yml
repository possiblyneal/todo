name: Set up toolchains
description: Installs a toolchain for each language manifest present in the repository.

runs:
  using: composite
  steps:
    # scripts/ci fails when a manifest is present but its toolchain is
    # missing, so each toolchain installs only when this repository uses it.
    #
    # Detection comes from scripts/detect rather than being written out
    # again here. This file used to carry its own copy, which is how a language ends
    # up installed for the local scripts and missing in CI.
    - name: Detect toolchains
      id: detect
      shell: bash
      run: scripts/detect github-output >> "$GITHUB_OUTPUT"

    - name: Set up Node
      if: steps.detect.outputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install Node dependencies
      if: steps.detect.outputs.node == 'true'
      shell: bash
      run: |
        if [[ -s package-lock.json ]]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi

    - name: Set up Python
      if: steps.detect.outputs.python == 'true'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Set up Go
      if: steps.detect.outputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Set up Rust
      if: steps.detect.outputs.rust == 'true'
      shell: bash
      run: rustup component add clippy rustfmt

    # GitHub's Ubuntu runners include Swift, but this controls the requested
    # version rather than inheriting whatever the runner image happens to ship.
    - name: Set up Swift
      if: steps.detect.outputs.swift == 'true'
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: latest

    - name: Set up Java
      if: steps.detect.outputs.kotlin == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      if: steps.detect.outputs.kotlin == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
